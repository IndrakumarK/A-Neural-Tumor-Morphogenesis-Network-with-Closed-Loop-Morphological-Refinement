# NTMN Default Configuration
project:
  name: "NTMN"
  task: "multimodal_brain_tumor_segmentation"
  seed: 42
  device: "cuda"

# ---------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------
data:
  root: "data"

  modalities:
    - T1
    - T1ce
    - T2
    - FLAIR

  input_channels: 4
  num_classes: 4
  image_size: [256, 256]
  dimension: "2D"

  normalize: "zscore_per_modality"

  # Patient-level partitioning:
  # UPenn-GBM: 70/15/15
  # TCGA-GBM: 70/15/15
  # MOTUM: 70/15/15
  split:
    strategy: "patient_level"
    train: 0.70
    validation: 0.15
    test: 0.15

  augmentation:
    enabled: true

    horizontal_flip: true
    vertical_flip: true

    rotation:
      enabled: true
      type: "small_angle"
      degrees: 10

    scaling:
      enabled: true
      min: 0.90
      max: 1.10

  # Dataset-specific availability of the four-class output space.
  # Verify the exact dataset-specific class mapping in the
  # preprocessing/data-loading implementation before finalizing.
  valid_classes:
    UPenn-GBM: [true, true, true, true]
    TCGA-GBM: [true, true, true, true]
    MOTUM: [true, true, false, true]


# ---------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------
model:
  name: "NTMN"

  input_channels: 4
  num_classes: 4

  feature_channels:
    stage1: 64
    stage2: 128
    stage3: 256

  structural_feature_dim: 256

  recurrent:
    type: "ConvGRU"
    steps: 3

  morphology:
    enabled: true

    # Six morphology descriptors defined in the manuscript.
    descriptors:
      - area
      - centroid
      - covariance
      - elongation
      - soft_boundary
      - soft_compactness

    # Tumor morphology descriptors are used in their computed form.
    # No descriptor normalization is assumed in the current manuscript.
    descriptor_normalization:
      enabled: false

  knowledge_feedback:
    enabled: true
    type: "residual_structural_correction"

  topology:
    enabled: true
    method: "soft_euler_characteristic"
    connectivity: 8

  connectivity:
    enabled: true
    method: "local_soft_adjacency"
    connectivity: 8

  uncertainty:
    enabled: true
    method: "normalized_predictive_entropy"
    auxiliary_prediction: true

  decoder:
    channels:
      - 256
      - 128
      - 4


# ---------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------
training:
  epochs: 150
  batch_size: 8

  optimizer:
    name: "AdamW"
    learning_rate: 0.0001
    weight_decay: 0.0001

  scheduler:
    name: "CosineAnnealingLR"
    min_learning_rate: 0.000001

  initialization:
    method: "Xavier"

  precision: "FP32"


# ---------------------------------------------------------------------
# Loss functions
# ---------------------------------------------------------------------
loss:

  # Main NTMN segmentation objective
  foreground_dice: 1.00
  structural_stability: 0.20
  morphology_estimation: 0.20
  knowledge_consistency: 0.20
  topology: 0.10
  connectivity: 0.10
  smoothness: 0.05
  uncertainty_consistency: 0.05

  # MBNSS objective
  mbnss:
    dice: 1.00
    boundary_position: 0.50
    boundary_normal: 0.25
    morphology: 0.25


# ---------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------
evaluation:

  metrics:
    - Dice
    - IoU
    - HD95
    - precision
    - sensitivity
    - specificity

  patient_level: true

  # Quantitative evaluation is performed on held-out test patients.
  # Dataset-specific unavailable classes are excluded.
  exclude_unavailable_classes: true

  statistical_analysis:
    enabled: true
    test: "Wilcoxon_signed_rank"
    alpha: 0.05
    correction: "Holm"
    bootstrap_resamples: 10000
    confidence_interval: 0.95


# ---------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------
reproducibility:
  random_seed: 42
  deterministic: true


# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging:
  enabled: true
  log_dir: "results/logs"
  save_checkpoints: true
  checkpoint_dir: "checkpoints"


# ---------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------
output:
  results_dir: "results"
  figures_dir: "figures"
  predictions_dir: "results/predictions"
